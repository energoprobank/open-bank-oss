openapi: 3.1.0
info:
  title: Interest Service API
  version: 1.9.0
  description: >-
    Interest accrual, capitalization, and rate configuration. Capitalization withholds Czech
    final tax on credit interest (§36/§38d ZDP, ADR-0033): CZK interest credited to a resident
    individual is taxed at source (15 %) and the customer is credited net; the gross/tax/net split
    is returned on the capitalization result. Withheld tax is remitted monthly to the finanční úřad
    (ADR-0038): the remittance endpoints assemble the per-period *Vyúčtování daně vybírané srážkou*
    and advance the paired records RECORDED → REMITTED.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8125
    description: Local development
tags:
  - name: Interest
  - name: Withholding remittance
  - name: Rate adjustments

paths:
  /api/v1/interest/accrue:
    post:
      tags: [Interest]
      summary: Accrue interest for a single account
      description: >-
        Idempotent (ADR-0291): one accrual per (account, accrualDate, product, currency) — the
        V12 UNIQUE key backs it. A retry with the same natural key replays the ORIGINAL accrual
        (200, no second write), even after the rate config was deactivated.
      operationId: accrueInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccrualRequest'
      responses:
        '200':
          description: Accrual result
        '422':
          description: >-
            No active rate config for the (account/product, currency) — the account has no rate in
            the requested currency, so nothing is accrued (issue #1265).

  /api/v1/interest/accrue/all:
    post:
      tags: [Interest]
      summary: Accrue interest for all accounts
      description: >-
        Re-runnable batch (ADR-0291): per-account dedup on the accrual natural key makes a second
        run for the same date a no-op for accounts already accrued; per-account failures collapse
        to a skip, never abort the batch.
      operationId: accrueAllInterest
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Accrual summary

  /api/v1/interest/capitalize/{accountId}:
    post:
      tags: [Interest]
      summary: Capitalize accrued interest
      description: >-
        Idempotent (ADR-0291, ADR-0033): the accrual set is claimed (ACCRUING → CAPITALIZING)
        before the ledger is told anything, and the ledger idempotency key is derived from
        (account, product, periodTo), so a plain retry collapses onto the journal the interrupted
        attempt booked — exactly-once on money.
      operationId: capitalizeInterest
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Capitalization result (net credited, with the withholding-tax split)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capitalization'

  /api/v1/interest/accruals:
    get:
      tags: [Interest]
      summary: List every interest accrual
      description: >-
        The unfiltered collection across all accounts (authorize action `interest.list`). Each
        entry carries the day-count convention of its rate configuration, defaulting to ACT_365
        when that configuration is no longer present.
      operationId: listAllAccruals
      responses:
        '200':
          description: All accruals

  /api/v1/interest/accounts/{accountId}/effective-rate:
    get:
      tags: [Interest]
      summary: The interest rate effective for an account (override, else product default)
      operationId: getEffectiveRate
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: ISO date to resolve the rate on. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The effective rate configuration
        '204':
          description: No rate configuration applies to this account and product on that date

  /api/v1/interest/accruals/{accountId}:
    get:
      tags: [Interest]
      summary: Get interest accruals for account
      operationId: getAccruals
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Accruals

  /api/v1/interest/accruals/{accountId}/summary:
    get:
      tags: [Interest]
      summary: Accrual summary for account
      operationId: getAccrualSummary
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary

  /api/v1/interest/capitalizations/{accountId}:
    get:
      tags: [Interest]
      summary: Get capitalization history
      operationId: getCapitalizations
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capitalizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capitalization'

  /api/v1/interest/withholding/remittances:
    post:
      tags: [Withholding remittance]
      summary: Assemble (or return) the monthly withholding remittance for a tax period
      description: >-
        Assembles the per-period *Vyúčtování daně vybírané srážkou* (§38d ZDP, ADR-0038), folding all
        tax actually withheld in the month into one batch, advancing the paired records
        RECORDED → REMITTED, and emitting `interest.withholding.remitted.v1`. Idempotent: one batch
        per `(year, month)` — re-running returns the assembled batch (ADR-0291; the
        `uq_withholding_remittance_period` UNIQUE key, V4, is the race backstop).
      operationId: assembleWithholdingRemittance
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '201':
          description: Remittance batch (assembled or pre-existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingRemittance'
    get:
      tags: [Withholding remittance]
      summary: List assembled withholding remittance batches
      operationId: listWithholdingRemittances
      responses:
        '200':
          description: Remittance batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WithholdingRemittance'

  /api/v1/interest/withholding/remittances/{year}/{month}:
    get:
      tags: [Withholding remittance]
      summary: Get the withholding remittance batch for a tax period
      operationId: getWithholdingRemittance
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Remittance batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingRemittance'
        '404':
          description: No remittance assembled for this period

  /api/v1/interest/rates:
    post:
      tags: [Interest]
      summary: Create interest rate config
      description: >-
        Idempotent (ADR-0291): a retry carrying the same natural key (productId, accountId,
        currency, effectiveFrom) replays the already-active config instead of minting a shadowing
        duplicate. A rate CHANGE carries a different effectiveFrom and persists normally.
      operationId: createRateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestRateConfig'
      responses:
        '201':
          description: Rate config created
    get:
      tags: [Interest]
      summary: List interest rate configs
      operationId: listRateConfigs
      parameters:
        - name: productId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Rate configs

  /api/v1/interest/rates/{id}:
    get:
      tags: [Interest]
      summary: Get rate config by ID
      operationId: getRateConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rate config
    delete:
      tags: [Interest]
      summary: Deactivate rate config
      operationId: deactivateRateConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deactivated

  /api/v1/interest/accounts/{accountId}/rate-adjustments:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Rate adjustments]
      summary: Add an additive, time-boxed rate adjustment to an account
      description: >-
        Records a signed delta in basis points that the daily accrual ADDS to the account's rate
        (its per-account override, else its product default) on every date in [validFrom, validTo).
        Any number of adjustments may be active; they sum, and the result is clamped at 0. The
        existing per-account override is untouched. Guard: 0 < |deltaBps| <= 300, validTo after
        validFrom, at most 400 days. Idempotent on sourceRef: the same body again answers 200 with
        the existing adjustment; the same sourceRef with different terms answers 409
        SOURCE_REF_CONFLICT. Authorize action `interest.adjust` — granted only to the rewards
        engine's service account.
      operationId: createRateAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRateAdjustmentRequest'
      responses:
        '201':
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateAdjustment'
        '200':
          description: Replay of an earlier create with the same sourceRef and identical terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateAdjustment'
        '400':
          description: A guard failed or a required field is missing
        '409':
          description: sourceRef already used with different terms (SOURCE_REF_CONFLICT)
    get:
      tags: [Rate adjustments]
      summary: List an account's rate adjustments (every status, newest first)
      description: >-
        Authorize action `interest.adjustList` — the rewards engine's service account and human
        operators/admins. `effectiveRatePct` is not populated on list items.
      operationId: listRateAdjustments
      responses:
        '200':
          description: The account's adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateAdjustment'

  /api/v1/interest/accounts/{accountId}/rate-adjustments/{adjustmentId}:
    delete:
      tags: [Rate adjustments]
      summary: Cancel a rate adjustment (compensation)
      description: >-
        Flips the adjustment to CANCELLED; idempotent (cancelling a cancelled adjustment answers 200
        with it unchanged). Forward-looking: accruals already booked are not recomputed. Authorize
        action `interest.adjustCancel` — granted only to the rewards engine's service account.
      operationId: cancelRateAdjustment
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: adjustmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cancelled adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateAdjustment'
        '404':
          description: No such adjustment on this account (RATE_ADJUSTMENT_NOT_FOUND)

components:
  schemas:
    AccrualRequest:
      type: object
      required: [accountId, accrualDate]
      properties:
        accountId:
          type: string
          format: uuid
        productId:
          type: string
        balance:
          type: number
        currency:
          type: string
        accrualDate:
          type: string
          format: date

    Capitalization:
      type: object
      description: >-
        A credited interest capitalization. Per ADR-0033 the customer is credited the net amount;
        grossAmount/taxAmount/netAmount expose the withholding split. For non-CZK interest no tax is
        withheld in v1 (deferred), so net = gross and taxAmount = 0.
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        productId:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        totalAccrued:
          type: number
          description: Sum of the period's gross daily accruals.
        grossAmount:
          type: number
          description: Gross interest before withholding.
        taxAmount:
          type: number
          description: Withholding tax retained at source (whole CZK; 0 when not withheld).
        netAmount:
          type: number
          description: Net interest credited to the customer (= capitalizedAmount).
        capitalizedAmount:
          type: number
          description: The amount actually credited (the net amount).
        currency:
          type: string
          minLength: 3
          maxLength: 3
        ledgerEntryId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    WithholdingRemittance:
      type: object
      description: >-
        A monthly withholding-tax remittance batch (ADR-0038) — the *Vyúčtování daně vybírané srážkou*
        for one tax month. Aggregates all tax actually withheld (treatment WITHHELD, currency CZK) in
        the period, owed to the finanční úřad by dueDate (§38d odst. 3 ZDP).
      properties:
        id:
          type: string
          format: uuid
        periodYear:
          type: integer
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
        authority:
          type: string
          description: The Czech tax authority (CZ-FU) in v1.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        totalTaxAmount:
          type: number
          description: Sum of whole-CZK tax withheld in the period.
        itemCount:
          type: integer
          description: Number of withholding records folded into the batch.
        dueDate:
          type: string
          format: date
          description: End of the month following the withholding month (§38d odst. 3).
        status:
          type: string
          enum: [PENDING, SETTLED]
          description: PENDING until the delegated cash leg to the tax authority is confirmed.
        createdAt:
          type: string
          format: date-time

    InterestRateConfig:
      type: object
      required: [productId]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        accountId:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            ISO-4217 currency this rate applies to. Rates are currency-specific; accrual resolves a
            rate only in the accrual's own currency, so an account cannot accrue in a currency it has
            no rate for (issue #1265). Accrual against a currency with no config yields HTTP 422.
        rateType:
          type: string
          enum: [FIXED, VARIABLE, TIERED]
        annualRate:
          type: number
        rateIndex:
          type: string
          nullable: true
          enum: [CZEONIA, PRIBOR_1M, PRIBOR_3M, PRIBOR_6M, ESTR, EURIBOR_3M]
          description: >-
            VARIABLE rates only: the market index this rate follows (ADR-0314). Set together with
            `spread` or not at all; anything else is rejected with 400.
        spread:
          type: number
          nullable: true
          description: VARIABLE rates only. Margin over `rateIndex`, a decimal fraction like `annualRate`.
        minBalance:
          type: number
        maxBalance:
          type: number
          nullable: true
        dayCount:
          type: string
          enum: [ACT_365, ACT_360, ACT_ACT, THIRTY_360]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRateAdjustmentRequest:
      type: object
      required: [deltaBps, validFrom, validTo, source, sourceRef, approvalRef]
      properties:
        deltaBps:
          type: integer
          minimum: -300
          maximum: 300
          description: Signed change in basis points (100 = 1 percentage point); 0 is rejected.
        validFrom:
          type: string
          format: date
          description: First accrual date the adjustment applies to (inclusive).
        validTo:
          type: string
          format: date
          description: End of the window (exclusive); after validFrom, at most 400 days later.
        source:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 32
          example: REWARDS
        sourceRef:
          type: string
          maxLength: 128
          description: Caller's idempotency key, unique across all adjustments.
        approvalRef:
          type: string
          maxLength: 128
          description: Reference to the approval/decision that authorised the adjustment.

    RateAdjustment:
      type: object
      required: [adjustmentId, accountId, deltaBps, validFrom, validTo, status]
      properties:
        adjustmentId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        deltaBps:
          type: integer
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
        source:
          type: string
        sourceRef:
          type: string
        approvalRef:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        effectiveRatePct:
          type: number
          nullable: true
          description: >-
            The account's resulting annual rate in percent (4.5 = 4.5 % p.a.) after every ACTIVE
            adjustment — as of today while the window runs, else as of validFrom. Null when no base
            rate resolves for the account (no override and no accrual history yet). Set on create
            and cancel responses only.
