openapi: 3.0.3
info:
  title: OpenBank Everyday Service API
  version: 1.2.0
  description: >-
    Everyday money (experience v2 step 3): biller registry, the Energo-Pro electricity account and its
    bills, bill reminders. Machine callers only (customer-edge, with the party id from the customer's token).
servers:
  - url: /api/v1/everyday
security:
  - bearer: []
paths:
  /parties/{partyId}/bills/billers:
    get:
      summary: Billers in the customer's market
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      responses:
        "200": {description: Billers, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Biller"}}}}}
  /parties/{partyId}/bills/energo-pro:
    get:
      summary: The linked Energo-Pro account and its current bill (linked=false when none)
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      responses:
        "200": {description: The account, content: {application/json: {schema: {$ref: "#/components/schemas/ElectricityAccount"}}}}
  /parties/{partyId}/bills/energo-pro/bills:
    get:
      summary: The linked account's bills, newest first (empty when not linked)
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      responses:
        "200": {description: Bills, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Bill"}}}}}
  /parties/{partyId}/bills/energo-pro/link:
    post:
      summary: Link the customer's own Energo-Pro customer number
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_number, data_sharing_consent]
              properties:
                customer_number: {type: string, pattern: "^EP-\\d{7}$"}
                data_sharing_consent: {type: boolean}
      responses:
        "200": {description: Linked, content: {application/json: {schema: {$ref: "#/components/schemas/ElectricityAccount"}}}}
        "400": {description: No consent or a malformed number}
        "404": {description: "NO_MATCH: no Energo-Pro customer with this number and the customer's name"}
        "409": {description: "ALREADY_LINKED: linked to another customer"}
    delete:
      summary: Unlink the Energo-Pro account
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      responses:
        "204": {description: Unlinked}
  /parties/{partyId}/bills/reminders:
    get:
      summary: Bill reminders and the bills they will remind about
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      responses:
        "200": {description: Reminders, content: {application/json: {schema: {$ref: "#/components/schemas/Reminders"}}}}
    put:
      summary: Turn reminders on or off and choose the days before the due date (0-14)
      parameters: [{$ref: "#/components/parameters/PartyId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
                days_before: {type: integer, minimum: 0, maximum: 14}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/Reminders"}}}}
        "400": {description: days_before out of range}
  /parties/{partyId}/direct-debits/mandates:
    get: {summary: Direct-debit consents, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"200": {description: Mandates}}}
    post: {summary: "Allow a creditor to collect (INKASO, SIPO, SEPA_CORE)", parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"201": {description: Created}, "400": {description: Invalid}, "404": {description: Not the customer's account}, "409": {description: MANDATE_EXISTS}}}
  /parties/{partyId}/direct-debits/mandates/{id}:
    delete: {summary: Withdraw a consent, parameters: [{$ref: "#/components/parameters/PartyId"}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: Cancelled}, "404": {description: Not found}}}
  /parties/{partyId}/subscriptions:
    get: {summary: Detected subscriptions, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"200": {description: Subscriptions}}}
  /parties/{partyId}/subscriptions/{id}/cancel:
    post: {summary: Ask to stop a subscription, parameters: [{$ref: "#/components/parameters/PartyId"}, {name: id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: CANCEL_REQUESTED}, "404": {description: Not found}}}
  /parties/{partyId}/subscriptions/{id}/reminder:
    put: {summary: Remind before the next charge, parameters: [{$ref: "#/components/parameters/PartyId"}, {name: id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Saved}}}
  /parties/{partyId}/accounts/{accountId}/insights/spending:
    get: {summary: "A month's spending by category (month=yyyy-MM)", parameters: [{$ref: "#/components/parameters/PartyId"}, {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}, {name: month, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Spending}}}
  /parties/{partyId}/accounts/{accountId}/insights/cash-flow:
    get: {summary: "Month-end forecast (balance = today's, from the caller)", parameters: [{$ref: "#/components/parameters/PartyId"}, {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}, {name: balance, in: query, required: true, schema: {type: number}}], responses: {"200": {description: Cash flow}}}
  /parties/{partyId}/accounts/{accountId}/exports:
    post: {summary: Export payments (CSV or PDF), parameters: [{$ref: "#/components/parameters/PartyId"}, {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"201": {description: "READY, with a download token"}}}
  /parties/{partyId}/accounts/{accountId}/exports/{exportId}:
    get: {summary: An export, parameters: [{$ref: "#/components/parameters/PartyId"}, {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}, {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: The export}}}
  /export-files/{token}:
    get: {summary: The file behind a download token (404 when unknown or expired), parameters: [{name: token, in: path, required: true, schema: {type: string}}], responses: {"200": {description: CSV or PDF}, "404": {description: Unknown or expired}}}
  /parties/{partyId}/money/transactions/{transactionId}/recall:
    post: {summary: Recall a transfer, parameters: [{$ref: "#/components/parameters/PartyId"}, {name: transactionId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"201": {description: SENT_TO_BANK}, "409": {description: "NOT_RECALLABLE, USE_DISPUTE, RECALL_EXISTS"}}}
  /parties/{partyId}/money/top-ups:
    post: {summary: Start a card top-up, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"201": {description: "CREATED, with the checkout URL"}}}
  /parties/{partyId}/money/top-ups/{id}:
    get: {summary: "A top-up (credits once the acquirer authorised)", parameters: [{$ref: "#/components/parameters/PartyId"}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: The top-up}}}
  /parties/{partyId}/money/payment-protection:
    get: {summary: Payment protection, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"200": {description: Settings}}}
    put: {summary: Change payment protection, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"200": {description: Saved}, "400": {description: Invalid}}}
  /parties/{partyId}/money/energy-trend:
    get: {summary: Twelve months of Energo-Pro cost, parameters: [{$ref: "#/components/parameters/PartyId"}], responses: {"200": {description: Trend}, "404": {description: Not linked}}}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    PartyId: {name: partyId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Biller:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        iban: {type: string}
    Bill:
      type: object
      properties:
        id: {type: string}
        period: {type: string}
        amount: {type: number}
        currency: {type: string}
        due_date: {type: string, format: date}
        status: {type: string, enum: [DUE, PAID, OVERDUE]}
        collection_iban: {type: string}
        reference: {type: string}
        payment_id: {type: string, format: uuid, nullable: true, description: "The bank's payment of this bill, once paid; the target of a bill-cashback coupon."}
    ElectricityAccount:
      type: object
      properties:
        linked: {type: boolean}
        customer_number: {type: string, nullable: true}
        supplier_name: {type: string, nullable: true}
        current_bill: {allOf: [{$ref: "#/components/schemas/Bill"}], nullable: true}
        next_estimate: {type: number, nullable: true}
    Reminders:
      type: object
      properties:
        enabled: {type: boolean}
        days_before: {type: integer}
        upcoming: {type: array, items: {$ref: "#/components/schemas/Bill"}}
