# Incentive service workload. This is deliberately a separate, manual-sync rollout after the
# namespace/CNPG, Vault and Kafka prerequisites. The exact image was signed and attested before
# this desired-state pin; merging does not start a pod, create customer traffic, or prove health.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # CNPG and its backup remain wave 0. Do not create a pod until that data plane is healthy.
    argocd.argoproj.io/sync-wave: "1"
  name: incentive-service
  namespace: incentive
  labels:
    app.kubernetes.io/name: incentive-service
    app.kubernetes.io/part-of: incentive
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incentive-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-incentive-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "b86f5d0ec37ba285"
      labels:
        app.kubernetes.io/name: incentive-service
        app.kubernetes.io/part-of: incentive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incentive-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-incentive-service:sandbox-5cc84e19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8156
            - name: management
              containerPort: 8087
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://incentive-db-rw.incentive.svc:5432/openbank_incentive
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://incentive-db-rw.incentive.svc:5432/openbank_incentive
            - name: DB_USER
              value: openbank
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incentive-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incentive-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: KEYCLOAK_URL
              value: http://keycloak.iam.svc:8080
            # The customer edge obtains this M2M identity from Keycloak. The service rejects every
            # other ROLE_API caller and has no fallback, so a missing/wrong value fails closed.
            - name: INCENTIVE_CUSTOMER_CALLER_PRINCIPAL
              value: service-account-openbank-edge
            - name: PROMO_CODE_PEPPER
              valueFrom:
                secretKeyRef:
                  name: incentive-service-promo-code-pepper
                  key: PROMO_CODE_PEPPER
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from
        # the incentive-opa-bundle ConfigMap generated by gen-incentive-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a
            # plain data directory and merges every YAML into the root data document, so
            # rules-data.yaml and agents-data.yaml collide and the sidecar dies with
            # `/bundle/rules-data.yaml: merge error`. In bundle mode the roots declared in
            # .manifest keep them apart. Mount paths below must match those roots.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/incentive_rest_ext.rego
              subPath: incentive_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest
            # (`agents`, `rules`) — NOT flat in /bundle, which is what produced the
            # merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        # Do not make these projections optional. A pod that cannot authenticate to Kafka must
        # remain visibly unready rather than starting a plaintext-shaped outbox producer.
        - name: kafka-keystore
          secret:
            secretName: incentive-service-kafka-keystore
            optional: false
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            optional: false
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: incentive-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: incentive-service
  namespace: incentive
  labels:
    app.kubernetes.io/name: incentive-service
    app.kubernetes.io/part-of: incentive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incentive-service
  ports:
    - name: http
      port: 8156
      targetPort: http
