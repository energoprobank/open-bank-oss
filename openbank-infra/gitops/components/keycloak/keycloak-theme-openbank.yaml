# GENERATED by gen-theme-configmap.sh — do not hand-edit. Source: ./theme/openbank/login
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-openbank
  namespace: iam
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: iam
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak
    styles=css/login.css css/openbank.css
  openbank.css: |
    /* Energo-Pro Bank login theme (theme id "openbank"; colours from branding/brand.yaml).
     *
     * Contrast (WCAG 2.x, measured):
     *   #FFFFFF on Firefly #0A1324 ............ 18.6:1  header text
     *   Firefly #0A1324 on #FFFFFF ............ 18.6:1  card text
     *   #4B5A70 on #FFFFFF .................... 7.0:1   muted card text (6.6:1 on Polar)
     *   #1F66B3 on #FFFFFF .................... 5.8:1   links (5.5:1 on Polar)
     *   #FFFFFF on #2470C2 .................... 5.0:1   primary button label
     *   #FFFFFF on #1D5FA8 .................... 6.5:1   primary button hover
     *   #6B7B93 on #FFFFFF .................... 4.3:1   input border (non-text, >= 3:1)
     *   #3688DD on #FFFFFF .................... 3.7:1   focus ring (non-text, >= 3:1)
     */

    :root {
      --ep-firefly:       #0A1324;
      --ep-polar:         #F5F9FD;
      --ep-curious-blue:  #3688DD;
      --ep-blue-text:     #1F66B3;
      --ep-blue-button:   #2470C2;
      --ep-blue-hover:    #1D5FA8;
      --ep-muted:         #4B5A70;
      --ep-input-border:  #6B7B93;
    }

    .login-pf {
      background: var(--ep-firefly);
    }

    .login-pf body {
      background:
        radial-gradient(ellipse 900px 480px at 50% -10%, rgba(54, 136, 221, 0.22), transparent 65%),
        var(--ep-firefly);
      min-height: 100vh;
    }

    /* Hide the stock Keycloak logo/branding */
    #kc-logo,
    #kc-logo-wrapper,
    .kc-logo-text,
    div.kc-logo-text {
      display: none !important;
      background-image: none !important;
    }

    /* Header: Energo-Pro logo (white lockup) above the realm/bank name */
    #kc-header,
    #kc-header-wrapper {
      width: 100%;
      margin: 0 auto;
      text-align: center;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: none;
      line-height: 1.3;
      white-space: normal;
    }

    #kc-header-wrapper {
      padding: 48px 16px 24px;
    }

    #kc-header-wrapper::before {
      content: "";
      display: block;
      width: 240px;
      height: 82px;
      margin: 0 auto 16px;
      /* File name kept from upstream (k8s subPath mount); content is the Energo-Pro white logo. */
      background: url("../img/openbank-vault.png") no-repeat center center;
      background-size: contain;
    }

    @media (max-width: 767px) {
      #kc-header-wrapper {
        padding: 24px 16px 16px;
        font-size: 1.05rem;
        color: #FFFFFF;
      }

      #kc-header-wrapper::before {
        width: 180px;
        height: 62px;
      }
    }

    /* Login card: white on Firefly, Firefly text */
    .card-pf {
      background: #FFFFFF;
      border: 0;
      border-top: 4px solid var(--ep-curious-blue);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      color: var(--ep-firefly);
    }

    #kc-page-title,
    .card-pf label,
    .card-pf .pf-c-form__label-text {
      color: var(--ep-firefly);
    }

    #kc-form-options,
    #kc-registration,
    .login-pf-page .login-pf-signup,
    .card-pf .subtitle,
    .card-pf .pf-c-form__helper-text {
      color: var(--ep-muted);
    }

    #kc-info,
    #kc-info-wrapper {
      background: var(--ep-polar);
      color: var(--ep-firefly);
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    .pf-c-form-control {
      background: #FFFFFF;
      border: 1px solid var(--ep-input-border);
      color: var(--ep-firefly);
      border-radius: 6px;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    .pf-c-form-control:focus {
      border-color: var(--ep-blue-text);
      box-shadow: 0 0 0 2px var(--ep-curious-blue);
      outline: none;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--ep-muted);
    }

    .btn-primary,
    .pf-c-button.pf-m-primary {
      background: var(--ep-blue-button);
      border: 1px solid var(--ep-blue-button);
      color: #FFFFFF;
      font-weight: 600;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover,
    .btn-primary:focus,
    .pf-c-button.pf-m-primary:hover,
    .pf-c-button.pf-m-primary:focus {
      background: var(--ep-blue-hover);
      border-color: var(--ep-blue-hover);
      color: #FFFFFF;
    }

    .btn-primary:focus-visible,
    .pf-c-button.pf-m-primary:focus-visible {
      outline: 2px solid var(--ep-curious-blue);
      outline-offset: 2px;
    }

    .card-pf a {
      color: var(--ep-blue-text);
    }

    .card-pf a:hover {
      color: var(--ep-blue-hover);
    }

    .pf-c-button.pf-m-plain,
    button[aria-label*="password"] {
      color: var(--ep-muted);
    }
  messages_en.properties: |
    # Energo-Pro Bank branding — replaces the default realm/Keycloak wording
    loginTitle=Sign in to Energo-Pro Bank
    loginTitleHtml=Energo-Pro Bank
binaryData:
  openbank-vault.png: 
  favicon.ico: 
