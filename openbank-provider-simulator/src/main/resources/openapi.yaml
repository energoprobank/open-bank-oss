openapi: 3.0.3
info:
  title: OpenBank Provider Simulator API
  version: 1.3.0
  description: >-
    NON-PRODUCTION stand-in for third-party providers (Energo-Pro customer system, e-mail/SMS gateway,
    Czech Bank iD, identity verification and liveness). Machine callers only (M2M token).
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /energo-pro/customers/{customerNumber}:
    get:
      summary: An Energo-Pro electricity customer by customer number
      parameters:
        - {name: customerNumber, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        "200": {description: The customer, content: {application/json: {schema: {$ref: "#/components/schemas/EnergoProCustomer"}}}}
        "404": {description: Energo-Pro has no such customer}
  /energo-pro/customers/{customerNumber}/supply-points:
    get:
      summary: The customer's supply points (electricity meter points)
      parameters:
        - {name: customerNumber, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        "200": {description: Supply points, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SupplyPoint"}}}}}
        "404": {description: Energo-Pro has no such customer}
  /energo-pro/customers/{customerNumber}/bills:
    get:
      summary: The customer's bills of the last twelve months, newest first
      parameters:
        - {name: customerNumber, in: path, required: true, schema: {type: string, maxLength: 32}}
      responses:
        "200": {description: Bills, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Bill"}}}}}
        "404": {description: Energo-Pro has no such customer}
  /energo-pro/collection-accounts:
    get:
      summary: Energo-Pro's collection account per market (for a bank's biller registry)
      responses:
        "200": {description: Collection accounts, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CollectionAccount"}}}}}
  /energo-pro/payments:
    post:
      summary: A bank's notice that a bill was paid (matched by reference)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PaymentNotice"}}}
      responses:
        "200": {description: The bill, now PAID (the same notice twice answers the same), content: {application/json: {schema: {$ref: "#/components/schemas/Bill"}}}}
        "404": {description: No bill with this reference}
        "409": {description: AMOUNT_MISMATCH — currency differs or amount below the bill}
  /acquirer/checkouts:
    post:
      summary: Open a card checkout (the customer pays on checkout_url, the acquirer's own page)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [amount, currency, merchant_reference], properties: {amount: {type: number}, currency: {type: string, enum: [CZK, EUR]}, merchant_reference: {type: string, maxLength: 64}}}}}}
      responses:
        "201": {description: "{id, amount, currency, merchant_reference, status, checkout_url, card_last4}"}
        "400": {description: Invalid}
  /acquirer/checkouts/{id}:
    get:
      summary: A checkout (CREATED, AUTHORISED, DECLINED, EXPIRED)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: The checkout}, "404": {description: Unknown}}
  /card-factory/orders:
    post:
      summary: Order a plastic card (the same reference twice answers the first order)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reference, name_on_card], properties: {reference: {type: string}, design: {type: string}, name_on_card: {type: string, maxLength: 26}, city: {type: string}, country: {type: string, enum: [CZ, BG]}}}}}}
      responses: {"201": {description: "{id, reference, status, carrier, tracking_number, expected_on, events}"}, "400": {description: Invalid}}
  /card-factory/orders/{id}:
    get:
      summary: "An order: ORDERED, IN_PRODUCTION, SHIPPED or DELIVERED"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: The order}, "404": {description: Unknown}}
  /wallet/apple/provisioning:
    post:
      summary: Apple Pay in-app provisioning data (simulator keys)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [card_reference, certificates, nonce, nonce_signature], properties: {card_reference: {type: string}, certificates: {type: array, items: {type: string}}, nonce: {type: string}, nonce_signature: {type: string}}}}}}
      responses: {"200": {description: "{activation_data, encrypted_pass_data, ephemeral_public_key, token_reference, token_last4}"}, "400": {description: Invalid}}
  /otp/messages:
    post:
      summary: Deliver one e-mail or SMS
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SendMessage"}}}
      responses:
        "202": {description: Accepted for delivery, content: {application/json: {schema: {$ref: "#/components/schemas/Message"}}}}
        "400": {description: Invalid request}
  /otp/outbox:
    get:
      summary: Sandbox — what was delivered to one recipient (newest first)
      parameters:
        - {name: recipient, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Messages, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Message"}}}}}
  /bankid/sessions:
    post:
      summary: Start a Bank iD identification
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VerificationRequest"}}}
      responses:
        "201": {description: Started, content: {application/json: {schema: {$ref: "#/components/schemas/Verification"}}}}
  /bankid/sessions/{id}:
    get:
      summary: A Bank iD session
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: The session, content: {application/json: {schema: {$ref: "#/components/schemas/Verification"}}}}
        "404": {description: Unknown or expired}
  /idv/verifications:
    post:
      summary: Start a document scan (DOCUMENT_SCAN) or a liveness check (LIVENESS)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VerificationRequest"}}}
      responses:
        "201": {description: Started, content: {application/json: {schema: {$ref: "#/components/schemas/Verification"}}}}
  /idv/verifications/{id}:
    get:
      summary: A verification's checks and result
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: The verification, content: {application/json: {schema: {$ref: "#/components/schemas/Verification"}}}}
        "404": {description: Unknown or expired}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    SupplyPoint:
      type: object
      properties:
        id: {type: string, description: EAN of the meter point}
        customer_number: {type: string}
        street: {type: string}
        city: {type: string}
        postal_code: {type: string}
        tariff: {type: string}
        currency: {type: string}
        monthly_advance: {type: number}
    Bill:
      type: object
      properties:
        id: {type: string}
        customer_number: {type: string}
        supply_point_id: {type: string}
        period: {type: string, description: "yyyy-MM"}
        amount: {type: number}
        currency: {type: string}
        issued_on: {type: string, format: date}
        due_date: {type: string, format: date}
        status: {type: string, enum: [DUE, PAID, OVERDUE]}
        collection_iban: {type: string}
        reference: {type: string}
        consumption_kwh: {type: integer}
    CollectionAccount:
      type: object
      properties:
        market: {type: string, enum: [CZ, BG]}
        name: {type: string}
        iban: {type: string}
        bic: {type: string}
        currency: {type: string}
    PaymentNotice:
      type: object
      required: [reference, amount, currency]
      properties:
        reference: {type: string, maxLength: 35}
        amount: {type: number}
        currency: {type: string}
        payer_iban: {type: string}
        bank_reference: {type: string}
    EnergoProCustomer:
      type: object
      properties:
        customer_number: {type: string, example: EP-1000001}
        market: {type: string, enum: [CZ, BG]}
        first_name: {type: string}
        last_name: {type: string}
        street: {type: string}
        city: {type: string}
        postal_code: {type: string}
        email: {type: string}
        phone: {type: string}
    SendMessage:
      type: object
      required: [channel, recipient, text]
      properties:
        channel: {type: string, enum: [EMAIL, SMS]}
        recipient: {type: string, maxLength: 254}
        text: {type: string, maxLength: 480}
    Message:
      type: object
      properties:
        id: {type: string}
        channel: {type: string, enum: [EMAIL, SMS]}
        recipient: {type: string}
        text: {type: string}
        sent_at: {type: string, format: date-time}
    Applicant:
      type: object
      properties:
        given_name: {type: string}
        family_name: {type: string}
        date_of_birth: {type: string, format: date}
        national_id: {type: string}
    VerificationRequest:
      type: object
      required: [reference, applicant]
      properties:
        kind: {type: string, enum: [DOCUMENT_SCAN, LIVENESS]}
        reference: {type: string, maxLength: 128}
        applicant: {$ref: "#/components/schemas/Applicant"}
        document_type: {type: string, enum: [ID_CARD, PASSPORT, RESIDENCE_PERMIT]}
    Verification:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [DOCUMENT_SCAN, BANK_ID, LIVENESS]}
        reference: {type: string}
        status: {type: string, enum: [IN_PROGRESS, VERIFIED, FAILED]}
        checks:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [DOCUMENT, CHIP, LIVENESS, FACE_MATCH, BANK_ID]}
              status: {type: string, enum: [PENDING, PASSED, FAILED]}
        identity:
          allOf: [{$ref: "#/components/schemas/Applicant"}]
          nullable: true
