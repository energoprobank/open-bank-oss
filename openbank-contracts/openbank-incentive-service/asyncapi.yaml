# SPDX-License-Identifier: Apache-2.0
# ADR-0006: every delivered Kafka topic has a versioned AsyncAPI contract.
asyncapi: 3.0.0

info:
  title: OpenBank Incentive Service — events
  version: 1.2.0
  description: |
    Lifecycle evidence emitted from the incentive transactional outbox. This topic does not
    authorize pricing, settlement, account mutation or cash rewards; consumers treat it as an
    at-least-once notification of a transition already committed in incentive-service.

    Party identity: every event type below carries NO party identifier EXCEPT
    `incentive.reservation.committed_for_party.v1` (added 1.2.0 for the FLUX rewards engine, which
    issues the offer's reward from it). It is an ADDITIONAL message on the same topic — chosen over a
    dedicated topic so no new Kafka topic/ACL is needed and the outbox keeps one ordered channel per
    reservation; the existing `committed.v1` / `committed.v2` messages are unchanged and still emitted.
    Consumers that do not recognise an eventType must skip it (campaign-service does).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

defaultContentType: application/json

channels:
  incentiveEvents:
    address: openbank.incentive.events
    title: Governed incentive lifecycle evidence
    description: |
      The Kafka key is `aggregateId`, preserving order for one offer or reservation. Delivery is
      at least once; consumers must deduplicate by `idempotency-key` / `ce-id`.
    messages:
      offerCreated: {$ref: '#/components/messages/offerCreated'}
      offerSubmitted: {$ref: '#/components/messages/offerSubmitted'}
      offerPublished: {$ref: '#/components/messages/offerPublished'}
      codesImported: {$ref: '#/components/messages/codesImported'}
      reservationCreated: {$ref: '#/components/messages/reservationCreated'}
      reservationCommitted: {$ref: '#/components/messages/reservationCommitted'}
      reservationReleased: {$ref: '#/components/messages/reservationReleased'}
      reservationExpired: {$ref: '#/components/messages/reservationExpired'}
      attributedReservationCreated: {$ref: '#/components/messages/attributedReservationCreated'}
      attributedReservationCommitted: {$ref: '#/components/messages/attributedReservationCommitted'}
      attributedReservationReleased: {$ref: '#/components/messages/attributedReservationReleased'}
      attributedReservationExpired: {$ref: '#/components/messages/attributedReservationExpired'}
      reservationCommittedForParty: {$ref: '#/components/messages/reservationCommittedForParty'}

operations:
  publishIncentiveEvidence:
    action: send
    channel:
      $ref: '#/channels/incentiveEvents'
    messages:
      - $ref: '#/channels/incentiveEvents/messages/offerCreated'
      - $ref: '#/channels/incentiveEvents/messages/offerSubmitted'
      - $ref: '#/channels/incentiveEvents/messages/offerPublished'
      - $ref: '#/channels/incentiveEvents/messages/codesImported'
      - $ref: '#/channels/incentiveEvents/messages/reservationCreated'
      - $ref: '#/channels/incentiveEvents/messages/reservationCommitted'
      - $ref: '#/channels/incentiveEvents/messages/reservationReleased'
      - $ref: '#/channels/incentiveEvents/messages/reservationExpired'
      - $ref: '#/channels/incentiveEvents/messages/attributedReservationCreated'
      - $ref: '#/channels/incentiveEvents/messages/attributedReservationCommitted'
      - $ref: '#/channels/incentiveEvents/messages/attributedReservationReleased'
      - $ref: '#/channels/incentiveEvents/messages/attributedReservationExpired'
      - $ref: '#/channels/incentiveEvents/messages/reservationCommittedForParty'

components:
  schemas:
    outboxHeaders:
      type: object
      required: [ce-id, idempotency-key]
      properties:
        ce-id:
          type: string
          format: uuid
          description: Stable UUIDv7 outbox event id.
        idempotency-key:
          type: string
          format: uuid
          description: Equal to `ce-id`; use for at-least-once deduplication.
        x-openbank-synthetic:
          type: string
          enum: ['true', 'false']
    eventType:
      type: string
      enum:
        - incentive.offer.created.v1
        - incentive.offer.submitted.v1
        - incentive.offer.published.v1
        - incentive.codes.imported.v1
        - incentive.reservation.created.v1
        - incentive.reservation.committed.v1
        - incentive.reservation.released.v1
        - incentive.reservation.expired.v1
        - incentive.reservation.created.v2
        - incentive.reservation.committed.v2
        - incentive.reservation.released.v2
        - incentive.reservation.expired.v2
        - incentive.reservation.committed_for_party.v1
    lifecycleEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, correlationId, aggregateId, eventType, occurredAt]
      properties:
        eventId: {type: string, format: uuid}
        correlationId: {type: string, format: uuid}
        aggregateId: {type: string, format: uuid}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
    attributedReservationLifecycle:
      type: object
      additionalProperties: false
      required:
        - eventId
        - correlationId
        - aggregateId
        - eventType
        - occurredAt
        - reservationId
        - offerRef
        - attributionRef
        - status
      properties:
        eventId: {type: string, format: uuid}
        correlationId: {type: string, format: uuid}
        aggregateId: {type: string, format: uuid}
        eventType:
          type: string
          enum:
            - incentive.reservation.created.v2
            - incentive.reservation.committed.v2
            - incentive.reservation.released.v2
            - incentive.reservation.expired.v2
        occurredAt: {type: string, format: date-time}
        reservationId: {type: string, format: uuid}
        offerRef:
          type: object
          additionalProperties: false
          required: [id, name, version]
          properties:
            id: {type: string, format: uuid}
            name: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
        attributionRef:
          type: string
          format: uuid
          description: Opaque campaign interaction reference; never a party identifier or promo code.
        status: {type: string, enum: [RESERVED, COMMITTED, RELEASED, EXPIRED]}
    reservationCommittedForParty:
      type: object
      additionalProperties: false
      required:
        - eventId
        - correlationId
        - aggregateId
        - eventType
        - occurredAt
        - reservationId
        - offerId
        - offerRef
        - partyId
        - productRef
        - source
        - committedAt
      properties:
        eventId: {type: string, format: uuid}
        correlationId: {type: string, format: uuid}
        aggregateId:
          type: string
          format: uuid
          description: The reservation id (also the Kafka key).
        eventType: {type: string, const: incentive.reservation.committed_for_party.v1}
        occurredAt: {type: string, format: date-time}
        reservationId:
          type: string
          format: uuid
          description: Deduplication key for reward issuance (one committed reservation = one reward).
        offerId: {type: string, format: uuid}
        offerRef:
          type: object
          additionalProperties: false
          required: [id, name, version]
          properties:
            id: {type: string, format: uuid}
            name: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
        partyId:
          type: string
          minLength: 1
          description: >-
            The reservation's party reference. A party UUID for customer-edge and rewards-engine
            redemptions; an operator-entered reference for staff reservations.
        productRef:
          type: string
          description: Product the code was reserved for, or the redemption context (ONBOARDING, HUB, TERM_DEPOSIT).
        attributionRef:
          type: [string, 'null']
          format: uuid
        source:
          type: string
          enum: [RESERVATION_COMMIT, DIRECT_REDEMPTION]
          description: DIRECT_REDEMPTION = POST /api/v1/incentives/redemptions (reserve + commit in one step).
        committedAt:
          type: string
          format: date-time
          description: Business commit time (qualifiedAt for an attributed commit).

  messages:
    offerCreated:
      <<: &lifecycleEvidence
        title: An incentive offer, inventory or reservation transition committed
        contentType: application/json
      name: incentive.offer.created.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.offer.created.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.offer.created.v1}}
    offerSubmitted:
      <<: *lifecycleEvidence
      name: incentive.offer.submitted.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.offer.submitted.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.offer.submitted.v1}}
    offerPublished:
      <<: *lifecycleEvidence
      name: incentive.offer.published.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.offer.published.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.offer.published.v1}}
    codesImported:
      <<: *lifecycleEvidence
      name: incentive.codes.imported.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.codes.imported.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.codes.imported.v1}}
    reservationCreated:
      <<: *lifecycleEvidence
      name: incentive.reservation.created.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.created.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.reservation.created.v1}}
    reservationCommitted:
      <<: *lifecycleEvidence
      name: incentive.reservation.committed.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.committed.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.reservation.committed.v1}}
    reservationReleased:
      <<: *lifecycleEvidence
      name: incentive.reservation.released.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.released.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.reservation.released.v1}}
    reservationExpired:
      <<: *lifecycleEvidence
      name: incentive.reservation.expired.v1
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.expired.v1}}
      payload:
        allOf:
          - $ref: '#/components/schemas/lifecycleEnvelope'
          - properties: {eventType: {const: incentive.reservation.expired.v1}}
    attributedReservationCreated:
      <<: *lifecycleEvidence
      name: incentive.reservation.created.v2
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.created.v2}}
      payload:
        allOf:
          - $ref: '#/components/schemas/attributedReservationLifecycle'
          - properties: {eventType: {const: incentive.reservation.created.v2}}
    attributedReservationCommitted:
      <<: *lifecycleEvidence
      name: incentive.reservation.committed.v2
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.committed.v2}}
      payload:
        allOf:
          - $ref: '#/components/schemas/attributedReservationLifecycle'
          - properties: {eventType: {const: incentive.reservation.committed.v2}}
    attributedReservationReleased:
      <<: *lifecycleEvidence
      name: incentive.reservation.released.v2
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.released.v2}}
      payload:
        allOf:
          - $ref: '#/components/schemas/attributedReservationLifecycle'
          - properties: {eventType: {const: incentive.reservation.released.v2}}
    attributedReservationExpired:
      <<: *lifecycleEvidence
      name: incentive.reservation.expired.v2
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.expired.v2}}
      payload:
        allOf:
          - $ref: '#/components/schemas/attributedReservationLifecycle'
          - properties: {eventType: {const: incentive.reservation.expired.v2}}
    reservationCommittedForParty:
      <<: *lifecycleEvidence
      name: incentive.reservation.committed_for_party.v1
      summary: A reservation committed, naming its party (FLUX rewards reward issuance)
      headers:
        allOf:
          - $ref: '#/components/schemas/outboxHeaders'
          - type: object
            required: [ce-type]
            properties: {ce-type: {const: incentive.reservation.committed_for_party.v1}}
      payload:
        $ref: '#/components/schemas/reservationCommittedForParty'
