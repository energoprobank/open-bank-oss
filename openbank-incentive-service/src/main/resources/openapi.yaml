openapi: 3.0.3
info:
  title: OpenBank Incentive Service
  version: 1.5.0
  description: Governed fixed-benefit offers and opaque promo-code reservations.
paths:
  /api/v1/customer-incentives/codes/check:
    post:
      summary: Whether a promo code is usable at account opening (customer-edge only; reserves nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 128 }
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  offerName: { type: string, nullable: true }
        '403': { description: Caller is not customer-edge }
  /api/v1/customer-incentives/offers/{id}/reservations:
    post:
      summary: Reserve an attributed offer for an authenticated customer through customer-edge
      description: >-
        Internal ROLE_API boundary. The caller derives X-Customer-Party-Id from the customer JWT
        and resolves the immutable offer and attribution reference from trusted server state.
      parameters:
        - {$ref: '#/components/parameters/OfferId'}
        - name: X-Customer-Party-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerReserveCode'}
      responses:
        "201":
          description: Reserved or idempotently replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerReservation'}
        "400": {description: Missing trusted party, idempotency key, or invalid request}
        "404": {description: Offer or code not found}
        "409": {description: Replay mismatch, inventory, offer, attribution, or limit conflict}
  /api/v1/customer-incentives/reservations/{id}/commit:
    post:
      summary: Commit an attributed reservation after the trusted qualifying action succeeds
      description: >-
        Internal customer-edge boundary. Party identity comes from the customer JWT and productRef
        is the validated catalogue product. qualifiedAt is the authoritative account openedAt so a
        crash-window retry can replay the same business outcome without extending reservation TTL.
      parameters:
        - {$ref: '#/components/parameters/ReservationId'}
        - name: X-Customer-Party-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCommitReservation'}
      responses:
        "200": {description: Committed or idempotently replayed, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerReservation'}}}}
        "400": {description: Missing trusted party or malformed qualifying evidence}
        "403": {description: Caller is not the configured customer-edge workload}
        "404": {description: Reservation does not belong to the trusted party and product}
        "409": {description: Reservation expired or is terminal in another state}
  /api/v1/customer-incentives/reservations/{id}/release:
    post:
      summary: Release an attributed reservation after a deterministic qualifying-action rejection
      parameters:
        - {$ref: '#/components/parameters/ReservationId'}
        - name: X-Customer-Party-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerReleaseReservation'}
      responses:
        "200": {description: Released or idempotently replayed, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerReservation'}}}}
        "400": {description: Missing trusted party or malformed request}
        "403": {description: Caller is not the configured customer-edge workload}
        "404": {description: Reservation does not belong to the trusted party and product}
        "409": {description: Reservation is committed or terminal in another state}
  /api/v1/incentives/offers:
    get:
      summary: List immutable published incentive offers for governed catalogue selection
      responses:
        "200":
          description: Published offers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Offer'}}
    post:
      summary: Create a versioned draft incentive offer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOffer'}
      responses:
        "201": {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}}
        "400": {description: Invalid offer}
  /api/v1/incentives/offers/{id}:
    get:
      summary: Resolve an immutable incentive offer reference
      parameters: [{$ref: '#/components/parameters/OfferId'}]
      responses:
        "200": {description: Offer found, content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}}
        "404": {description: Offer not found}
  /api/v1/incentives/offers/{id}/submit:
    post:
      summary: Submit an offer for independent approval
      parameters: [{$ref: '#/components/parameters/OfferId'}]
      responses:
        "200": {description: Submitted, content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}}
        "404": {description: Offer not found}
        "409": {description: Invalid lifecycle transition}
  /api/v1/incentives/offers/{id}/publish:
    post:
      summary: Publish an offer as an independent checker
      parameters: [{$ref: '#/components/parameters/OfferId'}]
      responses:
        "200": {description: Published, content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}}
        "404": {description: Offer not found}
        "409": {description: Maker-checker or lifecycle conflict}
  /api/v1/incentives/offers/{id}/codes:
    post:
      summary: Import promo codes as one-way peppered digests
      parameters: [{$ref: '#/components/parameters/OfferId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes: {type: array, minItems: 1, items: {type: string, minLength: 8, maxLength: 128}, writeOnly: true}
      responses:
        "201": {description: Codes imported, content: {application/json: {schema: {type: object, required: [imported], properties: {imported: {type: integer}}}}}}
        "404": {description: Offer not found}
        "409": {description: Published inventory is immutable}
  /api/v1/incentives/offers/{id}/reservations:
    post:
      summary: Atomically reserve one eligible promo code
      parameters:
        - {$ref: '#/components/parameters/OfferId'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveCode'}
      responses:
        "201": {description: Reserved or idempotently replayed, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        "400": {description: Missing idempotency key or invalid code}
        "404": {description: Offer or code not found}
        "409": {description: Offer, inventory, or limit conflict}
  /api/v1/incentives/reservations/{id}/commit:
    post:
      summary: Commit a reservation after the qualifying action succeeds
      parameters: [{$ref: '#/components/parameters/ReservationId'}]
      responses:
        "200": {description: Committed, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        "404": {description: Reservation not found}
        "409": {description: Reservation expired or terminal}
  /api/v1/incentives/reservations/{id}/release:
    post:
      summary: Release a reservation back to inventory
      parameters: [{$ref: '#/components/parameters/ReservationId'}]
      responses:
        "200": {description: Released, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        "404": {description: Reservation not found}
        "409": {description: Reservation is committed or terminal}
  /api/v1/incentives/redemptions:
    post:
      summary: Redeem a promo code for a party in one step (rewards engine)
      description: >-
        Service-to-service route for the FLUX rewards engine only (principal
        service-account-openbank-rewards; OPA action incentive.redemption.redeem). Resolves the
        offer from the code, then reserves AND commits in one transaction, enforcing the offer's
        total and per-party limits and its stacking policy against the party's committed, still
        live offers in the same context. An offer is claimable when it is published, inside its
        window, and either claimableInHub, scoped to no product, or scoped to the context by name.
        The commit emits incentive.reservation.committed_for_party.v1 (partyId, offerId,
        reservationId) on openbank.incentive.events. With an Idempotency-Key the same request
        replays the committed reservation; without one a retry answers CODE_USED.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Redemption'}
      responses:
        "200": {description: Redeemed or idempotently replayed, content: {application/json: {schema: {$ref: '#/components/schemas/RedemptionResult'}}}}
        "400": {description: Missing or malformed partyId, code or context}
        "403": {description: Caller is not the rewards engine}
        "404": {description: CODE_UNKNOWN — no published offer holds this code, content: {application/json: {schema: {$ref: '#/components/schemas/CodedError'}}}}
        "409": {description: 'CODE_USED, LIMIT_REACHED, NOT_STACKABLE, CODE_NOT_CLAIMABLE or IDEMPOTENCY_CONFLICT', content: {application/json: {schema: {$ref: '#/components/schemas/CodedError'}}}}
  /api/v1/incentives/maintenance/expire:
    post:
      summary: Expire overdue reservations idempotently
      responses:
        "200": {description: Expiry sweep result, content: {application/json: {schema: {type: object, required: [expired], properties: {expired: {type: integer}}}}}}
components:
  parameters:
    OfferId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ReservationId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    CreateOffer:
      type: object
      required: [name, version, productScope, effectiveFrom, expiresAt, totalLimit, perPartyLimit, stackingPolicy]
      properties:
        name: {type: string}
        version: {type: integer, minimum: 1}
        productScope:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Required (at least one item) unless claimableInHub is true.
        effectiveFrom: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        totalLimit: {type: integer, minimum: 1}
        perPartyLimit: {type: integer, minimum: 1}
        stackingPolicy: {type: string, enum: [EXCLUSIVE, STACKABLE]}
        claimableInHub:
          type: boolean
          default: false
          description: The rewards engine may redeem this offer's codes in one step in any context.
    Redemption:
      type: object
      required: [partyId, code, context]
      properties:
        partyId: {type: string, format: uuid}
        code: {type: string, minLength: 1, maxLength: 128}
        context: {type: string, enum: [ONBOARDING, HUB, TERM_DEPOSIT]}
    RedemptionResult:
      type: object
      required: [status, offerId, reservationId]
      properties:
        status: {type: string, enum: [REDEEMED]}
        offerId: {type: string, format: uuid}
        reservationId: {type: string, format: uuid}
    CodedError:
      type: object
      required: [error, code, message]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [CODE_UNKNOWN, CODE_USED, LIMIT_REACHED, NOT_STACKABLE, CODE_NOT_CLAIMABLE, IDEMPOTENCY_CONFLICT]
        message: {type: string}
    ReserveCode:
      type: object
      required: [code, partyRef, productRef]
      properties:
        code: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
        partyRef: {type: string}
        productRef: {type: string}
    CustomerReserveCode:
      type: object
      additionalProperties: false
      required: [code, productRef, attributionRef]
      properties:
        code: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
        productRef: {type: string, minLength: 1}
        attributionRef:
          type: string
          format: uuid
          description: Opaque campaign interaction reference resolved by customer-edge.
    CustomerReservation:
      type: object
      additionalProperties: false
      required: [id, offerRef, productRef, attributionRef, reservedAt, expiresAt, status]
      properties:
        id: {type: string, format: uuid}
        offerRef: {$ref: '#/components/schemas/OfferRef'}
        productRef: {type: string}
        attributionRef: {type: string, format: uuid}
        reservedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [RESERVED, COMMITTED, RELEASED, EXPIRED]}
    CustomerCommitReservation:
      type: object
      additionalProperties: false
      required: [productRef, qualifiedAt]
      properties:
        productRef: {type: string, minLength: 1}
        qualifiedAt: {type: string, format: date-time}
    CustomerReleaseReservation:
      type: object
      additionalProperties: false
      required: [productRef]
      properties:
        productRef: {type: string, minLength: 1}
    Offer:
      type: object
      required: [ref, productScope, effectiveFrom, expiresAt, totalLimit, perPartyLimit, stackingPolicy, status, maker]
      properties:
        ref: {$ref: '#/components/schemas/OfferRef'}
        productScope: {type: array, items: {type: string}}
        effectiveFrom: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        totalLimit: {type: integer}
        perPartyLimit: {type: integer}
        stackingPolicy: {type: string, enum: [EXCLUSIVE, STACKABLE]}
        status: {type: string, enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]}
        maker: {type: string}
        checker: {type: string, nullable: true}
        claimableInHub: {type: boolean}
    OfferRef:
      type: object
      required: [id, name, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        version: {type: integer}
    Reservation:
      type: object
      required: [id, offerRef, partyRef, productRef, idempotencyKey, reservedAt, expiresAt, status]
      properties:
        id: {type: string, format: uuid}
        offerRef: {$ref: '#/components/schemas/OfferRef'}
        partyRef: {type: string}
        productRef: {type: string}
        idempotencyKey: {type: string}
        reservedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [RESERVED, COMMITTED, RELEASED, EXPIRED]}
