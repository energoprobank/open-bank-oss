quarkus:
  application:
    name: openbank-incentive-service
  http:
    port: 8156
    test-port: 0
  datasource:
    db-kind: postgresql
    username: ${DB_USER:openbank}
    password: ${DB_PASSWORD:openbank_secret}
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_incentive}
      idle-timeout: 5M
      max-lifetime: 30M
      max-size: 20
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_incentive}
  flyway:
    migrate-at-start: true
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
  management:
    enabled: true
    port: 8087
    host: 0.0.0.0
    root-path: /q
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      incentive-events-out:
        connector: smallrye-kafka
        client:
          id: incentive-service-${quarkus.uuid}
        topic: openbank.incentive.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"

openbank:
  # Opt in to the libs-runtime OPA sidecar PolicyDecisionPoint producer (BUILD-TIME switch,
  # @IfBuildProperty, off when missing). The only @Authorize route is the rewards engine's
  # one-step redemption (incentive.redemption.redeem, incentive_rest_ext.rego); without the
  # producer it would fail closed with 503 "policy decision point not configured".
  authz:
    opa-pdp-producer:
      enabled: true
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s
  incentive:
    code-pepper: ${PROMO_CODE_PEPPER:}
    reservation-ttl: ${PROMO_RESERVATION_TTL:PT15M}
    # Fail closed: only customer-edge's configured workload principal may assert a customer party.
    customer-caller-principal: ${INCENTIVE_CUSTOMER_CALLER_PRINCIPAL:}

"%test":
  # No OPA in a test JVM: advisory HERE ONLY, so the HTTP contract tests reach the handler. The
  # redemption route stays closed to every other principal by its in-code guard
  # (requireRewardsRedeemer), which the tests exercise; the rego is covered by its own opa tests.
  authz:
    enforce: false
  # Never ask a developer's running OPA (the local stack binds 8181): a closed port keeps the test
  # JVM's decision "PDP unavailable", the same in CI and on a laptop.
  opa:
    url: http://127.0.0.1:1
  openbank:
    outbox:
      dispatch-enabled: false
    incentive:
      customer-caller-principal: service-account-openbank-edge
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
